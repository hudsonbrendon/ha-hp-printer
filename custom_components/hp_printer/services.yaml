scan:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hp_printer
    resolution:
      example: 300
      selector:
        number:
          min: 75
          max: 2400
          step: 25
          unit_of_measurement: dpi
          mode: box
    color_mode:
      example: rgb24
      selector:
        select:
          translation_key: scan_color_mode
          options:
            - rgb24
            - grayscale8
            - black_and_white1
    format:
      example: application_pdf
      selector:
        select:
          translation_key: scan_format
          options:
            - application_pdf
            - image_jpeg
    source:
      example: platen
      selector:
        select:
          translation_key: scan_source
          options:
            - platen
            - feeder
    filename:
      example: contract
      selector:
        text:

print_file:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hp_printer
    path:
      required: true
      example: /media/documents/ticket.pdf
      selector:
        text:
    format:
      example: application/pdf
      selector:
        text:
    copies:
      default: 1
      selector:
        number:
          min: 1
          max: 99
          mode: box

print_report:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hp_printer
    page:
      required: true
      example: network_summary
      selector:
        select:
          translation_key: report_page
          options:
            - configuration_page
            - network_summary
            - network_diagnostic_page
            - wireless_network_page
            - pq_diagnostics_page
            - diagnostics_page
            - extended_configuration_page
            - event_log_report
            - web_access_report
            - web_services_info_page
            - e_print_setup_page
            - wifi_direct_guide
            - cleaning_page
            - cleaning_page_level2
            - cleaning_verification_page
            - paper_feed_cleaning_page
            - rib_smear_cleaning_page

identify:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hp_printer

cancel_job:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hp_printer
    job_id:
      example: 42
      selector:
        number:
          min: 1
          mode: box

clean_cartridges:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hp_printer
    level:
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: slider
